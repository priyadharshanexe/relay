# Prometheus pulls metrics from the API and the workers every few seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: relay-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay-worker
    static_configs:
      - targets: ["worker:9100"]
