# Render's free tier puts a service to sleep after 15 idle minutes, and the next
# visitor waits ~50 s. This keeps the three portfolio demos awake during Indian
# working hours (09:30-16:30 IST). The window is sized to Render's 750 free
# instance-hours a month: 7 h x 3 services x 31 days = 651 h, leaving headroom
# for visitors outside it. GitHub may delay scheduled runs by a few minutes.
name: Keep demos awake

on:
  schedule:
    - cron: "*/10 4-10 * * *"   # UTC; 04:00-10:59 UTC = 09:30-16:29 IST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping each demo's health check
        run: |
          for url in \
            https://motorlane-4bmn.onrender.com/healthz \
            https://relay-3y3s.onrender.com/healthz \
            https://hartriage.onrender.com/healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || true)
            echo "$url -> $code"
          done
