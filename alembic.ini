# Used by the `alembic` command during development, for example:
#
#   uv run alembic revision --autogenerate -m "add refresh tokens"
#   uv run alembic upgrade head
#
# The database URL is not set here: migrations/env.py reads RELAY_DATABASE_URL
# through the application settings. In containers, `python -m relay.db.migrate`
# does the same job without needing this file.

[alembic]
script_location = relay/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
