# Local development stack: `docker compose up --build`
#
#   Dashboard http://localhost:8080
#   API       http://localhost:8000  (OpenAPI docs at /docs)
#   Postgres  localhost:5433  user/password/db: relay
#             (5433 on the host so it never clashes with a locally installed Postgres)
#   Redis     localhost:6379
#   Grafana   http://localhost:3000   Prometheus  http://localhost:9090

name: relay

x-app: &app
  build: .
  restart: unless-stopped
  environment:
    RELAY_ENVIRONMENT: development
    RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
    RELAY_REDIS_URL: redis://redis:6379/0
    RELAY_LOG_LEVEL: INFO
    RELAY_LOG_JSON: "true"
    # Development only: lets you point endpoints at receivers on your own machine
    # or on this Docker network over plain http. Production refuses this setting.
    RELAY_ENDPOINTS_ALLOW_PRIVATE_NETWORKS: "true"
    # How the worker reaches the API's built-in test receiver on this network.
    RELAY_RECEIVER_BASE_URL: http://api:8000
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "${RELAY_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${RELAY_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies database migrations, then exits. The API and worker start only
  # after it has finished successfully, so they never see a half-built schema.
  migrate:
    <<: *app
    command: ["python", "-m", "relay.db.migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"

  # The dashboard: http://localhost:8080
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "relay.worker"]
    # The image's HEALTHCHECK probes the HTTP API, which the worker doesn't serve.
    healthcheck:
      disable: true
    # Time to finish in-flight deliveries after SIGTERM before Docker kills it.
    stop_grace_period: 30s

  # Metrics: http://localhost:9090 (alerts under Status > Alerts)
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      api:
        condition: service_healthy

  # Dashboards: http://localhost:3000 (no login needed locally)
  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local convenience only: anyone who can reach port 3000 can view. The port
      # is bound to 127.0.0.1, so that means this machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
